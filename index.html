<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行揪團・活動列表</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Boarding List</span>
    <h1>旅行揪團活動</h1>
  </div>
</div>

<div class="share-bar">
  已選 <span id="selCount">0</span> / <span id="selMax">5</span>（liff.shareTargetPicker 一次最多可分享 5 則訊息）
  <button class="btn-teal" id="shareSelectedBtn" disabled>分享所選</button>
</div>

<div id="grid" class="grid">
  <div class="loading">載入活動中…</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/main.js"></script>
<script>
const selected = new Map(); // id -> activity
const MAX_ITEMS = (typeof CONFIG !== "undefined" && CONFIG.MAX_SHARE_ITEMS) || 5;

// 防止 Google Sheet 內容含有 HTML 字元而破版或被注入
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function statusHtml(a){
  return a.isFull
    ? `<span class="status full">候補中 ${esc(a.joined)}/${esc(a.capacity)}</span>`
    : `<span class="status open">尚可報名 ${esc(a.joined)}/${esc(a.capacity)}</span>`;
}

function cardHtml(a){
  return `
  <div class="ticket" data-id="${esc(a.id)}">
    ${a.isFull ? `<div class="stamp">已額滿・候補中</div>` : ""}
    ${a.cover ? `<img class="cover" src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">` : ""}
    <div class="main">
      <p class="title">${esc(a.title)}</p>
      <p class="meta">${esc(a.area)}｜${esc(a.date)}</p>
      ${a.price ? `<p class="price">NT$ ${esc(a.price)}</p>` : ""}
    </div>
    <div class="perforation"></div>
    <div class="stub">
      ${statusHtml(a)}
      <span>#${esc(a.id)}</span>
    </div>
    <div class="select-row">
      <label><input type="checkbox" class="pick" data-id="${esc(a.id)}"> 加入分享清單</label>
    </div>
    <div class="actions">
      <a class="btn btn-ghost" href="detail.html?id=${encodeURIComponent(a.id)}">活動詳情</a>
      <button class="btn btn-primary shareOneBtn" data-id="${esc(a.id)}">分享</button>
    </div>
  </div>`;
}

function updateShareBar(){
  document.getElementById("selCount").textContent = selected.size;
  document.getElementById("shareSelectedBtn").disabled = selected.size === 0;
}

async function main(){
  document.getElementById("selMax").textContent = MAX_ITEMS;
  await ensureLiff().catch(()=>{});

  const grid = document.getElementById("grid");
  let activities = [];
  try{
    activities = await fetchActivities();
  }catch(e){
    grid.innerHTML = `<div class="empty">活動資料讀取失敗，請確認 Google Sheet 設定。</div>`;
    console.error(e);
    return;
  }
  if(!activities.length){
    grid.innerHTML = `<div class="empty">目前尚無活動</div>`;
    return;
  }
  grid.innerHTML = activities.map(cardHtml).join("");

  const findById = id => activities.find(x => String(x.id) === id);

  grid.querySelectorAll(".shareOneBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const a = findById(btn.dataset.id);
      if(a) shareOne(a);
    });
  });

  grid.querySelectorAll(".pick").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const a = findById(cb.dataset.id);
      if(!a) return;
      if(cb.checked){
        if(selected.size >= MAX_ITEMS){
          cb.checked = false;
          alert(`一次最多只能分享 ${MAX_ITEMS} 個活動（LINE shareTargetPicker 限制）`);
          return;
        }
        selected.set(String(a.id), a);
      }else{
        selected.delete(String(a.id));
      }
      updateShareBar();
    });
  });

  document.getElementById("shareSelectedBtn").addEventListener("click", ()=>{
    if(selected.size) shareMany(Array.from(selected.values()));
  });
}

main();
</script>
</body>
</html>
